  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>

  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-180.png">
  <meta name="theme-color" content="#2E7D32">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f9fafb}
    #root{min-height:100vh}
    /* === Responsive max-width === */
    @media (min-width: 768px) {
      .dpms-app {
        max-width: 100% !important;
        width: 100% !important;
      }
    }

    /* === Landscape phone fix (phones only: max-height 500px) === */
    @media (orientation:landscape) and (max-height:500px) {
      .dpms-nav-bottom {
        width: 60px !important;
        height: 100vh !important;
        bottom: 0 !important;
        left: 0 !important;
        top: 0 !important;
        flex-direction: column !important;
        justify-content: flex-start !important;
        padding-top: 8px !important;
        position: fixed !important;
      }
      .dpms-content {
        margin-left: 64px !important;
        margin-bottom: 0 !important;
        padding-bottom: 8px !important;
      }
      .dpms-app {
        width: 100vw !important;
        max-width: 100vw !important;
      }
      .dpms-header {
        left: 60px !important;
        width: calc(100vw - 60px) !important;
      }
    }
  </style>

  .header h2 { font-size: 22px; font-weight: 900; color: #2e7d46; margin-bottom: 4px; }
  .header .sub { font-size: 13px; color: #5a7a5a; margin-bottom: 2px; }
  .header .meta { font-size: 11px; color: #8a9e88; margin-top: 6px; }

  .highlight td { background: #e8f4e8 !important; font-weight: 700; color: #1a5a2a; }

  .footer { text-align: center; padding: 24px 16px 8px; font-size: 11px; color: #8a9e88; }
